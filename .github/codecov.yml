# Codecov configuration for community-modules
# Validate: curl -X POST --data-binary @.github/codecov.yml https://codecov.io/validate

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "**/testdata/**"
  - "**/*_test.go"
  - "**/*.gen.go"

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 2%
        informational: true

comment:
  layout: "header, diff, flags, files, footer"
  hide_project_coverage: false
