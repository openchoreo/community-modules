name: Validate PR

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    paths:
      - ".github/workflows/pr.yaml"
      - "**/init/**"
      - "**/helm/**"
      - "**/module.yaml"
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "**/Dockerfile"
      - "**/Makefile"
      - "**/VERSION"

permissions:
  contents: read

jobs:
  detect-changed-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Detect changed modules
        id: detect
        run: |
          set -euo pipefail

          # Get the list of changed files compared to the base branch
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          MODULES=""
          FAILED=false

          for module_dir in */; do
            module="${module_dir%/}"

            # Skip if this module has no module.yaml
            if [ ! -f "${module}/module.yaml" ]; then
              continue
            fi

            # Check if any files in this module were changed
            if ! echo "$CHANGED_FILES" | grep -q "^${module}/"; then
              continue
            fi

            HAS_TESTS=false
            if [ -f "${module}/Makefile" ]; then
              # Fail if Makefile exists but has no unit-test target
              if grep -q '^unit-test:' "${module}/Makefile"; then
                HAS_TESTS=true
              else
                echo "::error::Module '${module}' has a Makefile but no 'unit-test' target. Please add a 'unit-test' target to ${module}/Makefile."
                FAILED=true
              fi
            fi

            HAS_IMAGES=false
            image_count=$(yq '.images | length' "${module}/module.yaml")
            if [ "$image_count" != "0" ] && [ "$image_count" != "null" ]; then
              HAS_IMAGES=true
            fi

            if [ "$HAS_TESTS" = "false" ] && [ "$HAS_IMAGES" = "false" ]; then
              echo "Skipping ${module}: no unit tests and no images"
              continue
            fi

            MODULES="${MODULES}${module}"$'\n'
          done

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "One or more modules have a Makefile without a 'unit-test' target."
            exit 1
          fi

          MATRIX=$(printf '%s' "$MODULES" | jq -R . | jq -sc .)
          echo "modules=${MATRIX}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Modules to validate: ${MATRIX}"

  docker-build:
    needs: detect-changed-modules
    if: ${{ needs.detect-changed-modules.outputs.modules != '[]' }}
    name: docker-build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changed-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        run: |
          set -euo pipefail

          module="${{ matrix.module }}"

          image_count=$(yq '.images | length' "${module}/module.yaml")
          if [ "$image_count" = "0" ] || [ "$image_count" = "null" ]; then
            echo "Skipping ${module}: no images defined"
            exit 0
          fi

          for i in $(seq 0 $((image_count - 1))); do
            image_name=$(yq ".images[${i}].name" "${module}/module.yaml")
            context=$(yq ".images[${i}].context" "${module}/module.yaml")
            dockerfile=$(yq ".images[${i}].dockerfile" "${module}/module.yaml")

            echo "::group::Building ${image_name}"
            docker buildx build \
              --platform linux/amd64 \
              --load \
              -t "${image_name}:pr-validation" \
              -f "${module}/${dockerfile}" \
              "${module}/${context}"
            echo "::endgroup::"
          done

  unit-test:
    needs: detect-changed-modules
    if: ${{ needs.detect-changed-modules.outputs.modules != '[]' }}
    name: unit-tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changed-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine Go version
        id: go-version
        run: |
          # Find the highest Go version across this module's go.mod files
          GO_VERSION=$(find "${{ matrix.module }}" -name 'go.mod' -exec grep '^go ' {} \; | awk '{print $2}' | sort -V | tail -1)
          echo "version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: ${{ steps.go-version.outputs.version != '' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Run unit tests
        run: |
          set -euo pipefail

          module="${{ matrix.module }}"

          if [ ! -f "${module}/Makefile" ] || ! grep -q '^unit-test:' "${module}/Makefile"; then
            echo "Skipping ${module}: no unit tests"
            exit 0
          fi

          make -C "${module}" unit-test

      - name: Upload coverage to Codecov
        if: ${{ hashFiles(format('{0}-coverage.out', matrix.module)) != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          files: ./${{ matrix.module }}-coverage.out
          flags: ${{ matrix.module }}
          disable_search: true
          fail_ci_if_error: false
