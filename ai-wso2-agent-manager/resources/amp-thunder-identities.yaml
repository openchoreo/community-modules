---
resource_type: application
id: am-observer-client
type: m2m
name: AM Observer Client
description: Dedicated client for agent-manager-observer to read observability data from the OpenChoreo observer
ouId: ${OU_ID}
inboundAuthConfig:
- type: oauth2
  config:
    clientId: am-observer-client
    clientSecret: ${AM_OBSERVER_CLIENT_SECRET}
    grantTypes:
    - client_credentials
    tokenEndpointAuthMethod: client_secret_basic
    pkceRequired: false
    publicClient: false
    token:
      accessToken:
        clientConfig:
          validityPeriod: 3600
          attributes:
          - ouId
          - ouHandle
---
resource_type: application
id: am-obs-mcp-client
type: browser
name: AMP Observer MCP
description: AMP Observer MCP application for interactive user login
ouId: ${OU_ID}
allowedUserTypes: ${USER_TYPES}
inboundAuthConfig:
- type: oauth2
  config:
    clientId: am-obs-mcp
    redirectUris:
    - http://127.0.0.1:33419/callback
    - http://localhost:33419/callback
    grantTypes:
    - authorization_code
    - refresh_token
    responseTypes:
    - code
    tokenEndpointAuthMethod: none
    pkceRequired: true
    publicClient: true
    scopes:
    - openid
    - profile
    - email
    - amp:observability:trace-read
    - amp:observability:log-read
    - amp:observability:build-log-read
    - amp:observability:metric-read
    token:
      accessToken:
        userConfig:
          validityPeriod: 3600
          attributes:
          - given_name
          - family_name
          - email
          - username
          - groups
          - ouId
          - ouHandle
      idToken:
        validityPeriod: 3600
        userAttributes:
        - given_name
        - family_name
        - email
        - username
        - groups
        - ouId
        - ouHandle
authFlowId: ${AUTH_FLOW_ID}
