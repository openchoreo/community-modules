# Deployment values for oci://ghcr.io/wso2/wso2-agent-manager 1.0.0 on an
# existing OpenChoreo v1.3.x installation.
#
# Pass this file BEFORE the identity values rendered by IDENTITY.md, so the
# rendered identity settings take precedence:
#   --values agent-manager.yaml --values <rendered>/agent-manager.yaml
#
# Hostnames and domains are set with --set in the README install command.

agentManagerService:
  # One replica, with autoscaling off. Each replica caches the policy manifest
  # gateways push in its own memory, and a replica that never received a push
  # rejects MCP OAuth (Agent Identity) security with "does not support
  # mcp-auth/mcp-authz v1 policies". To run more replicas, configure the Redis
  # manifest cache first (see the README), then raise these values.
  replicaCount: 1
  autoscaling:
    enabled: false
  config:
    gatewayManifestCache:
      backend: memory
    # OpenBao tokens Agent Manager uses to store agent secrets and to read Git
    # credentials. Without these, the chart falls back to the dev-mode token
    # "root", which a sealed OpenBao rejects.
    openbao:
      existingSecret: amp-openbao-token
    workflowPlaneOpenbao:
      existingSecret: amp-openbao-token
      existingSecretKey: workflow-plane-openbao-token
    openChoreo:
      baseURL: "http://openchoreo-api.openchoreo-control-plane.svc.cluster.local:8080"

console:
  replicaCount: 2

# The chart deploys an in-cluster PostgreSQL with a default password. For
# production, use a managed database instead and create the credentials Secret
# first (see the README):
# postgresql:
#   enabled: false
#   external:
#     host: "your-db.example.com"
#     port: 5432
#     database: agentmanager
#     username: agentmanager
#     existingSecret: amp-db-credentials
#     existingSecretPasswordKey: password
#     sslMode: require
