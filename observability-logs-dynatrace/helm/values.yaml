dynatrace:
  # Platform (Grail) API base URL of the environment the adapter queries, e.g.
  # https://abc12345.apps.dynatrace.com. REQUIRED when adapter.enabled is true.
  platformUrl: ""

  # Base URL of the environment's classic API, which serves log ingest, e.g.
  # https://abc12345.live.dynatrace.com (or https://<activegate>:9999/e/<env-id> through
  # an ActiveGate). When empty it is derived from platformUrl by replacing ".apps." with
  # ".live.". REQUIRED when fluent-bit.enabled is true and platformUrl is not set.
  ingestUrl: ""

  ingest:
    # Authorization scheme Fluent Bit sends the ingest token with:
    #   Api-Token - an access token with the logs.ingest scope (dt0c01.*)
    #   Bearer    - a platform token or OAuth token with openpipeline:logs:ingest
    authScheme: "Api-Token"
    # Verify the ingest endpoint's TLS certificate. Leave on for Dynatrace SaaS.
    tlsVerify: true

  # log.source stamped on every record, which scopes the adapter's queries to the records
  # this module ships. Both must differ, and must match on every cluster reporting to one
  # environment.
  containerLogsSource: "openchoreo-container-logs"
  auditLogsSource: "openchoreo-audit-logs"

  # Secret holding the Dynatrace credentials, in the release namespace. Create it with an
  # ExternalSecret (recommended), or set create=true to have the chart create it from the
  # values below for a quick trial.
  credentials:
    name: "dynatrace-credentials"
    create: false
    # Key names inside the Secret.
    ingestTokenKey: "DT_INGEST_TOKEN"
    platformTokenKey: "DT_PLATFORM_TOKEN"
    oauthClientIdKey: "DT_OAUTH_CLIENT_ID"
    oauthClientSecretKey: "DT_OAUTH_CLIENT_SECRET"
    # Only read when create=true. Do not commit real tokens to a values file.
    ingestToken: ""
    platformToken: ""
    oauthClientId: ""
    oauthClientSecret: ""

auditLogs:
  # Route the OpenChoreo audit trail to its own log.source. Requires fluent-bit where
  # openchoreo-api and observer run.
  enabled: false

  # Each entry grants a workload write access to the audit trail. Update these if the
  # control or observability plane runs in a non-default namespace.
  producers:
    - producer: openchoreo-api
      namespace: openchoreo-control-plane
      container: api-server
    - producer: observer
      namespace: openchoreo-observability-plane
      container: observer

  # Grail bucket the audit records are routed to by an OpenPipeline bucket-assignment
  # rule (see the README). When set, the adapter reads audit logs from this bucket only.
  # Leave empty to read from every bucket the platform token can see.
  bucket: ""

fluent-bit:
  enabled: true

  existingConfigMap: "fluent-bit"

  dnsPolicy: ClusterFirstWithHostNet

  env:
  - name: DT_INGEST_TOKEN
    valueFrom:
      secretKeyRef:
        name: dynatrace-credentials
        key: DT_INGEST_TOKEN

  fullnameOverride: "fluent-bit"

  hostNetwork: true

  extraVolumeMounts:
  - name: db
    mountPath: "/var/lib/fluent-bit/db"
    readOnly: false

  extraVolumes:
    - name: db
      hostPath:
        path: /var/lib/fluent-bit/db
        type: DirectoryOrCreate

  rbac:
    nodeAccess: true

  resources:
    limits:
      cpu: 100m
      memory: 150Mi
    requests:
      cpu: 25m
      memory: 125Mi

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL

    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10000

  testFramework:
    enabled: false

  initContainers:
  - name: set-volume-ownership
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 10000:10000 /var/lib/fluent-bit/db"]
    resources:
      limits:
        cpu: 15m
        memory: "32Mi"
      requests:
        cpu: 10m
        memory: "24Mi"
    securityContext:
      capabilities:
        add:
        - CHOWN
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 0
    volumeMounts:
    - name: db
      mountPath: /var/lib/fluent-bit/db

## -----------------------------------------------------------
## Values for OpenChoreo specific customizations and workloads
## -----------------------------------------------------------

fluentBitCustomizations:
  # Name of the cluster these records were collected from, stamped as k8s.cluster.name.
  # REQUIRED when fluent-bit.enabled is true; it cannot be defaulted. Letters, digits,
  # '.', '_' and '-' only.
  clusterInstance: ""

  # Container log files that are not shipped. Fluent Bit's own logs are always excluded
  # so a failing output cannot feed itself.
  excludePaths:
    - /var/log/containers/*_kube-system_*.log

  # Read container log files from the beginning on first start. Dynatrace rejects records
  # older than 24 hours, so on a node with old logs the first flushes may be rejected
  # until Fluent Bit catches up.
  readFromHead: true

adapter:
  enabled: true

  # How the adapter authenticates to the Grail query API:
  #   platformToken - a platform token (dynatrace.credentials.platformTokenKey)
  #   oauth         - an OAuth client (dynatrace.credentials.oauthClient*Key)
  # Both need the storage:logs:read and storage:buckets:read scopes.
  authMode: "platformToken"

  oauth:
    tokenUrl: "https://sso.dynatrace.com/sso/oauth2/token"
    scope: "storage:logs:read storage:buckets:read"
    # Optional resource URN, e.g. urn:dtaccount:<account-uuid>.
    resource: ""

  # Upper bound for one Grail query, including polling.
  queryTimeout: "30s"

  # Accept http:// for dynatrace.platformUrl and adapter.oauth.tokenUrl. The adapter sends
  # its credentials to both, so leave this off outside of a test double.
  allowInsecureHttp: false

  logLevel: "info"

  image:
    repository: "ghcr.io/openchoreo/observability-logs-dynatrace-adapter"
    tag: "" # Defaults to Chart.AppVersion via the template
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
