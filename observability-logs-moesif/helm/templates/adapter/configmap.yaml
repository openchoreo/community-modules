{{- if .Values.moesif.adapter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-adapter-moesif
  namespace: {{ .Release.Namespace }}
  labels:
    app: logs-adapter-moesif
data:
  SERVER_PORT: "9098"
  SEARCH_ENDPOINT: {{ .Values.moesif.adapter.searchEndpoint | quote }}
  SEARCH_AUTH_MODE: {{ .Values.moesif.auth_mode | quote }}

{{- end }}
