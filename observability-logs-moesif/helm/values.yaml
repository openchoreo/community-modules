## -----------------------------------------------------------
## Values for fluent-bit configuration
## -----------------------------------------------------------
fluent-bit:
  enabled: true

  luaScripts:
    detect_log_level.lua: |
      function detect_level(tag, timestamp, record)
          local log = record["log"] or record["message"] or ""
          local log_lower = string.lower(log)
          local levels = {"fatal", "error", "warn", "info", "debug", "trace"}
          for _, level in ipairs(levels) do
              if string.find(log_lower, level, 1, true) then
                  record["loglevel"] = string.upper(level)
                  return 2, timestamp, record
              end
          end
          record["loglevel"] = "INFO"
          return 2, timestamp, record
      end

  config:
    inputs: |
      [INPUT]
          Name                tail
          Tag                 kube.*
          Path                /var/log/containers/*.log
          Exclude_Path        /var/log/containers/fluent-bit-*.log
          DB                  /var/lib/fluent-bit/db/tail-container-logs.db
          multiline.parser    docker, cri
          Read_from_Head      On
          Refresh_Interval    5
          Skip_Long_Lines     On
          Buffer_Chunk_Size   32KB
          Buffer_Max_Size     2MB
          Mem_Buf_Limit       128MB
          Inotify_Watcher     false

    filters: |
      [FILTER]
          Name                lua
          Match               kube.*
          script              /fluent-bit/scripts/detect_log_level.lua
          call                detect_level

      [FILTER]
          Name                kubernetes
          Match               kube.*
          Kube_Tag_Prefix     kube.var.log.containers.
          K8S-Logging.Parser  On
          K8S-Logging.Exclude On
          Merge_Log           On
          Keep_Log            Off
          Labels              On
          Annotations         Off
      
      [FILTER]
          Name                nest
          Match               kube.*
          Operation           lift
          Nested_under        kubernetes
          Add_prefix          k8s_
      
      [FILTER]
          Name                modify
          Match               kube.*
          RENAME              k8s_labels attributes
      
      [FILTER]
          Name                nest
          Match               kube.*
          Operation           nest
          Wildcard            attributes
          Nest_under          resource


    outputs: |
      [OUTPUT]
          Name                           opentelemetry
          Match                          kube.*
          Host                           moesif-logs-collector
          Port                           4318
          TLS                            Off
          TLS.Verify                     Off
          logs_uri                       /v1/logs
          Log_response_payload           True
          logs_severity_text_message_key loglevel
          logs_resource_metadata_key     resource             

  dnsPolicy: ClusterFirstWithHostNet
  fullnameOverride: "fluent-bit"
  hostNetwork: true

  extraVolumeMounts:
    - name: db
      mountPath: "/var/lib/fluent-bit/db"
      readOnly: false

  extraVolumes:
    - name: db
      hostPath:
        path: /var/lib/fluent-bit/db
        type: DirectoryOrCreate

  rbac:
    nodeAccess: true

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10000

  testFramework:
    enabled: false

  initContainers:
    - name: set-volume-ownership
      image: busybox
      command: ["sh", "-c", "chown -R 10000:10000 /var/lib/fluent-bit/db"]
      resources:
        limits:
          cpu: 15m
          memory: "32Mi"
        requests:
          cpu: 10m
          memory: "24Mi"
      securityContext:
        capabilities:
          drop:
            - ALL
        privileged: true
        readOnlyRootFilesystem: true
        runAsUser: 0
      volumeMounts:
        - name: db
          mountPath: /var/lib/fluent-bit/db

## -----------------------------------------------------------
## Values for OpenTelemetry Collector configuration
## -----------------------------------------------------------
opentelemetry-collector:
  enabled: true
  fullnameOverride: "moesif-logs-collector"

  clusterRole:
    create: false

  configMap:
    create: false
    existingName: "moesif-logs-collector-config"

  image:
    repository: otel/opentelemetry-collector-contrib

  mode: deployment

  extraEnvsFrom:
    - secretRef:
        name: moesif-logs-collector-secret

  extraVolumes:
    - name: moesif-env-tokens
      secret:
        secretName: moesif-logs-collector-secret

  extraVolumeMounts:
    - name: moesif-env-tokens
      mountPath: /etc/moesif/env
      readOnly: true

  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 100Mi

  service:
    type: ClusterIP

opentelemetryCollectorCustomizations:
  debug:
    enabled: false

## -----------------------------------------------------------
## Values for OpenChoreo specific customizations and workloads
## -----------------------------------------------------------

moesif:
  adapter:
    enabled: true
    searchEndpoint: "https://api.moesif.com"
    searchSecretName: "moesif-logs-search-secret"
    image:
      repository: "ghcr.io/openchoreo/observability-logs-moesif-adapter"
      tag: "1.0.0"
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
