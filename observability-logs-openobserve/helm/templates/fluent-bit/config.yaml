{{- if (index .Values "fluent-bit").enabled }}
{{- if not .Values.fluentBitCustomizations.clusterInstance }}
{{- fail "fluentBitCustomizations.clusterInstance is required. It names the cluster these records came from and cannot be defaulted." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: {{ .Release.Namespace }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
{{- if .Values.auditLogs.enabled }}
        Parsers_File  /fluent-bit/etc/conf/audit-parsers.conf
{{- end }}
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name tail
        Buffer_Chunk_Size 32KB
        Buffer_Max_Size 2MB
        DB /var/lib/fluent-bit/db/tail-container-logs.db
        Exclude_Path /var/log/containers/fluent-bit-*.log,/var/log/containers/*_kube-system_*.log
        Inotify_Watcher false
        Mem_Buf_Limit 100MB
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Read_from_Head On
        Refresh_Interval 5
        Skip_Long_Lines On
        Tag kube.*

    [FILTER]
        Name kubernetes
        Buffer_Size 15MB
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Keep_Log On
        Match kube.*
        Merge_Log Off
        tls.verify Off
        Use_Kubelet true

    # Cluster identity stamped by the logs collector
    [FILTER]
        Name modify
        Match kube.*
        Set openchoreo_cluster_instance {{ .Values.fluentBitCustomizations.clusterInstance }}
{{- if .Values.auditLogs.enabled }}
{{ range $p := .Values.auditLogs.producers }}
    [FILTER]
        Name          rewrite_tag
        Match         kube.var.log.containers.*_{{ $p.namespace }}_{{ $p.container }}-*
        Rule          $log AUDIT-LOG(?!-) audit.{{ $p.producer }} false
        Emitter_Name  audit_emitter_{{ $p.producer }}
{{ end }}
    [FILTER]
        Name          parser
        Match         audit.*
        Key_Name      log
        Parser        audit_json
        Reserve_Data  On
        Preserve_Key  On
{{- /* OpenObserve takes a record's time from _timestamp. */}}

    [FILTER]
        Name  modify
        Match audit.*
        Copy  event_time _timestamp
{{- end }}

    [OUTPUT]
        Name http
        Match kube.*
        Host {{ .Values.common.openObserveHost }}
        Port {{ .Values.common.openObservePort }}
        URI /api/{{ .Values.common.openObserveOrg }}/{{ .Values.common.openObserveStream }}/_json
        Format json
        http_user ${OPENOBSERVE_USERNAME}
        http_passwd ${OPENOBSERVE_PASSWORD}
        tls {{ if .Values.common.openObserveTlsEnabled }}On{{ else }}Off{{ end }}
{{- if .Values.auditLogs.enabled }}
{{- $c := .Values.common }}
{{- $out := dict "host" $c.openObserveHost "port" $c.openObservePort "org" $c.openObserveOrg "tls" $c.openObserveTlsEnabled "env" "OPENOBSERVE" }}
{{- with .Values.auditLogs.output }}
{{- if .host }}
{{- $tls := $out.tls }}
{{- if kindIs "bool" .tlsEnabled }}
{{- $tls = .tlsEnabled }}
{{- end }}
{{- $out = dict "host" .host "port" (.port | default $out.port) "org" (.org | default $out.org) "tls" $tls "env" "AUDIT_OPENOBSERVE" }}
{{- end }}
{{- end }}

    [OUTPUT]
        Name http
        Match audit.*
        Host {{ $out.host }}
        Port {{ $out.port }}
        URI /api/{{ $out.org }}/{{ include "observability-logs-openobserve.auditStream" . }}/_json
        Format json
        http_user {{ printf "${%s_USERNAME}" $out.env }}
        http_passwd {{ printf "${%s_PASSWORD}" $out.env }}
        tls {{ if $out.tls }}On{{ else }}Off{{ end }}
{{- end }}

  parsers.conf: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
{{- if .Values.auditLogs.enabled }}

  audit-parsers.conf: |
    [PARSER]
        Name   audit_json
        Format json
{{- end }}
{{- end }}
