common:
  openObserveOrg: "default"
  openObserveStream: "default"
  openObserveEventsStream: "k8s_events"
  # Lowercase letters, digits and '_' only.
  openObserveAuditStream: "audit_logs"
  # Hostnames placed on the OpenObserve ingest HTTPRoute (gateway-default). Set this
  # to the gateway hostname remote Fluent Bit instances target in a multi-cluster setup.
  # Applies regardless of whether the standalone or HA OpenObserve chart is used.
  httpRouteHostnames: []
  # OpenObserve endpoint the Fluent Bit config ships logs to. Defaults to the in-cluster
  # Service; override in a multi-cluster setup to point remote Fluent Bit at the gateway.
  openObserveHost: "openobserve"
  openObservePort: 5080
  openObserveTlsEnabled: false

auditLogs:
  # Requires fluent-bit where openchoreo-api and observer run.
  enabled: false

  # Each entry grants a workload write access to the audit trail. Update these if the
  # control or observability plane runs in a non-default namespace.
  producers:
    - producer: openchoreo-api
      namespace: openchoreo-control-plane
      container: api-server
    - producer: observer
      namespace: openchoreo-observability-plane
      container: observer

  # Separate OpenObserve for audit records. Setting host uses the
  # openobserve-audit-credentials Secret (ZO_ROOT_USER_EMAIL and ZO_ROOT_USER_PASSWORD keys).
  output:
    host: ""
    # Defaults to common.openObservePort.
    port: ""
    # Defaults to common.openObserveOrg.
    org: ""
    # Defaults to common.openObserveTlsEnabled.
    tlsEnabled: null

fluent-bit:
  enabled: true

  existingConfigMap: "fluent-bit"

  dnsPolicy: ClusterFirstWithHostNet

  env:
  - name: OPENOBSERVE_USERNAME
    valueFrom:
      secretKeyRef:
        name: openobserve-admin-credentials
        key: ZO_ROOT_USER_EMAIL
  - name: OPENOBSERVE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: openobserve-admin-credentials
        key: ZO_ROOT_USER_PASSWORD
  # Credentials for auditLogs.output. Only read when auditLogs.output.host is set.
  - name: AUDIT_OPENOBSERVE_USERNAME
    valueFrom:
      secretKeyRef:
        name: openobserve-audit-credentials
        key: ZO_ROOT_USER_EMAIL
        optional: true
  - name: AUDIT_OPENOBSERVE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: openobserve-audit-credentials
        key: ZO_ROOT_USER_PASSWORD
        optional: true

  fullnameOverride: "fluent-bit"

  hostNetwork: true

  extraVolumeMounts:
  - name: db
    mountPath: "/var/lib/fluent-bit/db"
    readOnly: false

  extraVolumes:
    - name: db
      hostPath:
        path: /var/lib/fluent-bit/db
        type: DirectoryOrCreate

  rbac:
    nodeAccess: true

  resources:
    limits:
      cpu: 100m
      memory: 150Mi
    requests:
      cpu: 25m
      memory: 125Mi

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL

    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10000

  testFramework:
    enabled: false

  initContainers:
  - name: set-volume-ownership
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 10000:10000 /var/lib/fluent-bit/db"]
    resources:
      limits:
        cpu: 15m
        memory: "32Mi"
      requests:
        cpu: 10m
        memory: "24Mi"
    securityContext:
      capabilities:
        add:
        - CHOWN
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 0
    volumeMounts:
    - name: db
      mountPath: /var/lib/fluent-bit/db

openobserve-standalone:
  enabled: true

  extraEnv:
  # Allow alert webhook destinations that point at private IPs. OpenObserve's SSRF guard blocks private IPs by
  # default, which rejects in-cluster webhook destinations. In OpenChoreo, OpenObserve invokes the webhook endpoint
  # of the logs adapter running in the cluster. Hence this must be allowed.
  - name: ZO_SSRF_ALLOW_LOOPBACK
    value: "true"
  # Audit records keep their event time, and the default 5 hour ingest window would drop older records
  # replayed by Fluent Bit. Matches the default audit retention.
  - name: ZO_INGEST_ALLOWED_UPTO
    value: "8760"

  fullnameOverride: "openobserve"
  auth:
    ZO_ROOT_USER_EMAIL: ""
    ZO_ROOT_USER_PASSWORD: ""
    existingRootUserSecret:
      name: "openobserve-admin-credentials"
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      cpu: 500m
      memory: 1000Mi
    requests:
      cpu: 20m
      memory: 500Mi

openobserve:
  enabled: false

  extraEnv:
  # Allow alert webhook destinations that point at private IPs. OpenObserve's SSRF guard blocks private IPs by
  # default, which rejects in-cluster webhook destinations. In OpenChoreo, OpenObserve invokes the webhook endpoint
  # of the logs adapter running in the cluster. Hence this must be allowed.
  - name: ZO_SSRF_ALLOW_LOOPBACK
    value: "true"
  # See openobserve-standalone.extraEnv.
  - name: ZO_INGEST_ALLOWED_UPTO
    value: "8760"

  fullnameOverride: "openobserve"

## -----------------------------------------------------------
## Values for OpenChoreo specific customizations and workloads
## -----------------------------------------------------------

fluentBitCustomizations:
  # Name of the cluster these records were collected from. REQUIRED when
  # fluent-bit.enabled is true; it cannot be defaulted.
  clusterInstance: ""

adapter:
  enabled: true
  observerUrl: "http://observer-internal.openchoreo-observability-plane:8081"

  # Credentials to connect to OpenObserve
  openObserveCredentialsSecret:
    name: "openobserve-admin-credentials"
    userKey: "ZO_ROOT_USER_EMAIL"
    passwordKey: "ZO_ROOT_USER_PASSWORD"

  image:
    repository: "cr.openchoreo.dev/openchoreo/observability-logs-openobserve-adapter"
    tag: "" # Defaults to Chart.AppVersion via the template
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

openObserveSetup:
  enabled: true

  # Audit stream retention in days.
  auditLogsRetentionDays: 365

  image:
    repository: "cr.openchoreo.dev/openchoreo/observability-logs-openobserve-setup"
    tag: ""

  # Credentials to connect to OpenObserve
  openObserveCredentialsSecret:
    name: "openobserve-admin-credentials"
    userKey: "ZO_ROOT_USER_EMAIL"
    passwordKey: "ZO_ROOT_USER_PASSWORD"
