{{- if (index .Values "fluent-bit").enabled }}
{{- if not .Values.fluentBitCustomizations.clusterInstance }}
{{- fail "fluentBitCustomizations.clusterInstance is required. It names the cluster these records came from and cannot be defaulted. Set fluent-bit.enabled=false to install without log collection." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: {{ .Release.Namespace }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
{{- if .Values.auditLogs.enabled }}
        Parsers_File  /fluent-bit/etc/conf/audit-parsers.conf
{{- end }}
        Plugins_File  plugins.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name tail
        Buffer_Chunk_Size 32KB
        Buffer_Max_Size 2MB
        DB /var/lib/fluent-bit/db/tail-container-logs.db
        Exclude_Path /var/log/containers/fluent-bit-*.log,/var/log/containers/*_kube-system_*.log
        Inotify_Watcher false
        Mem_Buf_Limit 100MB
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Read_from_Head On
        Refresh_Interval 5
        Skip_Long_Lines On
        Tag kube.*

    [FILTER]
        Name multiline
        Match kube.*
        multiline.key_content log
        mode parser
        multiline.parser go, java, python{{ range .Values.fluentBitCustomizations.multilineParsers }}, {{ .name }}{{ end }}
        buffer On
        flush_ms 2000

    [FILTER]
        Name kubernetes
        Buffer_Size 15MB
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Keep_Log On
        Match kube.*
        Merge_Log Off
        tls.verify Off
        Use_Kubelet true

    # Cluster identity stamped by the logs collector
    [FILTER]
        Name modify
        Match kube.*
        Set openchoreo_cluster_instance {{ .Values.fluentBitCustomizations.clusterInstance }}
{{- if .Values.auditLogs.enabled }}

{{- range $p := .Values.auditLogs.producers }}
    [FILTER]
        Name          rewrite_tag
        Match         kube.var.log.containers.*_{{ $p.namespace }}_{{ $p.container }}-*
        Rule          $log AUDIT-LOG(?!-) audit.{{ $p.producer }} false
        Emitter_Name  audit_emitter_{{ $p.producer }}
{{ end }}
    [FILTER]
        Name          parser
        Match         audit.*
        Key_Name      log
        Parser        audit_json
        Reserve_Data  On
        Preserve_Key  On
{{- end }}

    [OUTPUT]
        Name opensearch
        Host {{ index .Values "fluent-bit" "openSearchHost" }}
        Port {{ index .Values "fluent-bit" "openSearchPort" }}
        Generate_ID On
        HTTP_Passwd ${OPENSEARCH_PASSWORD}
        HTTP_User ${OPENSEARCH_USERNAME}
        Logstash_Format On
        Logstash_DateFormat %Y-%m-%d
        Logstash_Prefix container-logs
        Match kube.*
        Replace_Dots On
        Suppress_Type_Name On
        tls On
        tls.verify Off
        tls.vhost {{ index .Values "fluent-bit" "openSearchVHost" | default "opensearch" }}
{{- if .Values.auditLogs.enabled }}

{{- $out := dict "host" (index .Values "fluent-bit" "openSearchHost") "port" (index .Values "fluent-bit" "openSearchPort") "vHost" (index .Values "fluent-bit" "openSearchVHost" | default "opensearch") "env" "OPENSEARCH" }}
{{- with .Values.auditLogs.output }}
{{- if .host }}
{{- $out = dict "host" .host "port" (.port | default $out.port) "vHost" (.vHost | default .host) "env" "AUDIT_OPENSEARCH" }}
{{- end }}
{{- end }}

{{- /* The output above matches kube.*, so audit records do not also land there. */}}
    [OUTPUT]
        Name opensearch
        Host {{ $out.host }}
        Port {{ $out.port }}
        Generate_ID On
        HTTP_Passwd {{ printf "${%s_PASSWORD}" $out.env }}
        HTTP_User {{ printf "${%s_USERNAME}" $out.env }}
        Logstash_Format On
        Logstash_DateFormat %Y-%m-%d
        Logstash_Prefix {{ include "observability-logs-opensearch.auditIndexPrefix" . | trimSuffix "-" }}
        Match audit.*
        Replace_Dots On
        Suppress_Type_Name On
        tls On
        tls.verify Off
        tls.vhost {{ $out.vHost }}
{{- end }}

  parsers.conf: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L

    # The go, java and python multiline parsers referenced by the multiline
    # filter above are built into Fluent Bit. Anything else, such as .NET
    # stack traces, is supplied through fluentBitCustomizations.multilineParsers
    # in values.yaml and rendered below as a [MULTILINE_PARSER] block. See
    # https://docs.fluentbit.io/manual/data-pipeline/filters/multiline-stacktrace
    {{- range .Values.fluentBitCustomizations.multilineParsers }}
    [MULTILINE_PARSER]
        name          {{ .name }}
        type          regex
        flush_timeout 2000
        {{- range .rules }}
        rule          "{{ .state }}" "{{ .regex }}" "{{ .nextState }}"
        {{- end }}
    {{- end }}
{{- if .Values.auditLogs.enabled }}


  audit-parsers.conf: |
    [PARSER]
        Name   audit_json
        Format json
{{- end }}
{{- end }}
