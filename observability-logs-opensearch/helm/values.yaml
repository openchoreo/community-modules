global:
  # Registry override for the module's own container images (adapter, setup).
  # When set, it replaces the registry host of each image repository. May
  # include a path (e.g. registry.example.com/ghcr.io) for path-preserving
  # mirrors. Empty uses each image's default registry.
  # NOTE: subchart images are governed by the subcharts' own keys — the
  # bundled OpenSearch chart uses global.dockerRegistry (it flows to
  # subcharts); the fluent-bit image needs fluent-bit.image.repository.
  imageRegistry: ""
  # Pull secrets for the module's own pods, for authenticated mirrors.
  # e.g. imagePullSecrets: [{name: my-registry-cred}]
  imagePullSecrets: []

fluent-bit:
  enabled: true

  existingConfigMap: "fluent-bit"

  env:
    - name: OPENSEARCH_USERNAME
      valueFrom:
        secretKeyRef:
          name: opensearch-admin-credentials
          key: username
    - name: OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: opensearch-admin-credentials
          key: password
    # Credentials for auditLogs.output. Only read when auditLogs.output.host is set.
    - name: AUDIT_OPENSEARCH_USERNAME
      valueFrom:
        secretKeyRef:
          name: opensearch-audit-credentials
          key: username
          optional: true
    - name: AUDIT_OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: opensearch-audit-credentials
          key: password
          optional: true

  dnsPolicy: ClusterFirstWithHostNet
  fullnameOverride: "fluent-bit"
  hostNetwork: true

  extraVolumeMounts:
    - name: db
      mountPath: "/var/lib/fluent-bit/db"
      readOnly: false

  extraVolumes:
    - name: db
      hostPath:
        path: /var/lib/fluent-bit/db
        type: DirectoryOrCreate

  rbac:
    nodeAccess: true

  resources:
    limits:
      cpu: 100m
      memory: 150Mi
    requests:
      cpu: 25m
      memory: 125Mi

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10000

  testFramework:
    enabled: false

  # Passed as a templatable string (the fluent-bit chart tpl-evaluates string
  # values in its own context, where the shared global.imageRegistry resolves)
  # so the init image honors the registry override.
  initContainers: |-
    - name: set-volume-ownership
      image: "{{ with .Values.global.imageRegistry }}{{ . }}/{{ end }}busybox:1.37.0"
      command: ["sh", "-c", "chown -R 10000:10000 /var/lib/fluent-bit/db"]
      resources:
        limits:
          cpu: 15m
          memory: "32Mi"
        requests:
          cpu: 10m
          memory: "24Mi"
      securityContext:
        capabilities:
          drop:
          - ALL
          add:
          - CHOWN
        readOnlyRootFilesystem: true
        runAsUser: 0
      volumeMounts:
      - name: db
        mountPath: /var/lib/fluent-bit/db
    {{- if .Values.waitForIndexTemplate.enabled }}
    - name: wait-for-index-template
      image: "{{ with .Values.global.imageRegistry }}{{ . }}/{{ end }}{{ .Values.waitForIndexTemplate.image }}"
      command:
      - sh
      - -c
      - |
        for t in $TEMPLATES; do
          until [ "$(curl -sk -o /dev/null -w '%{http_code}' -u "$OPENSEARCH_USERNAME:$OPENSEARCH_PASSWORD" \
                --connect-to "$OPENSEARCH_VHOST:$OPENSEARCH_PORT:$OPENSEARCH_HOST:$OPENSEARCH_PORT" \
                "https://$OPENSEARCH_VHOST:$OPENSEARCH_PORT/_index_template/$t")" = "200" ]; do
            echo "Waiting for OpenSearch index template $t..."
            sleep 5
          done
          echo "Index template $t found"
        done
      env:
      - name: OPENSEARCH_HOST
        value: {{ .Values.openSearchHost | quote }}
      - name: OPENSEARCH_PORT
        value: {{ .Values.openSearchPort | quote }}
      - name: OPENSEARCH_VHOST
        value: {{ .Values.openSearchVHost | default "opensearch" | quote }}
      - name: TEMPLATES
        value: {{ join " " .Values.waitForIndexTemplate.templateNames | quote }}
      - name: OPENSEARCH_USERNAME
        valueFrom:
          secretKeyRef:
            name: {{ .Values.waitForIndexTemplate.credentialsSecretName }}
            key: username
      - name: OPENSEARCH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{ .Values.waitForIndexTemplate.credentialsSecretName }}
            key: password
      resources:
        limits:
          cpu: 15m
          memory: "32Mi"
        requests:
          cpu: 10m
          memory: "24Mi"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10000
    {{- end }}

  # Holds fluent-bit in Init until the index templates it writes against exist, so
  # the first daily index gets the template's mappings instead of dynamic ones
  # openSearchSetup job creates them on the observability plane;
  # remote clusters wait on the same shared OpenSearch.
  # Disable if the templates are managed outside this chart.
  waitForIndexTemplate:
    enabled: true
    templateNames:
      - container-logs
      - audit-logs
    credentialsSecretName: opensearch-admin-credentials
    image: "curlimages/curl:8.22.0"

  # Values for fluent-bit config map
  openSearchHost: "opensearch"
  openSearchPort: 9200
  openSearchVHost: "opensearch"

auditLogs:
  # Route audit records to their own index and retention instead of the container
  # logs. Requires fluent-bit where openchoreo-api and observer run.
  #
  # Only routing is gated on this. The index template and retention policy apply on
  # every install, because an audit-logs-* index created ahead of its template gets
  # dynamic mappings and returns nothing.
  enabled: false

  # Index name prefix. The adapter reads the same value, so the two cannot drift.
  indexPrefix: "audit-logs-"

  # Separate OpenSearch for audit records. Setting host uses the
  # opensearch-audit-credentials Secret ('username' and 'password' keys).
  output:
    host: ""
    # Defaults to fluent-bit.openSearchPort.
    port: ""
    # TLS SNI hostname. Defaults to host.
    vHost: ""

  # The source allowlist, matched on the container log filename the kubelet writes,
  # so a pod cannot satisfy it from its own log line.
  #
  # Adding an entry grants a workload the right to write into the audit trail, and
  # should be reviewed as such. A non-default release namespace requires editing
  # these or audit collection silently stops.
  producers:
    - producer: openchoreo-api
      namespace: openchoreo-control-plane
      container: api-server
    - producer: observer
      namespace: openchoreo-observability-plane
      container: observer

openSearch:
  enabled: true

  extraEnvs:
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      value: ThisIsTheOpenSearchPassword1

  nameOverride: "opensearch"

  image:
    tag: "3.3.0"

  masterService: opensearch

  rbac:
    create: true
    serviceAccountName: "opensearch"

  singleNode: true

## -----------------------------------------------------------
## Values for OpenChoreo specific customizations and workloads
## -----------------------------------------------------------

fluentBitCustomizations:
  # Name of the cluster these records were collected from. REQUIRED when
  # fluent-bit.enabled is true; it cannot be defaulted.
  clusterInstance: ""

  # Custom multiline stack-trace parsers appended to the built-in go, java
  # and python parsers used by the multiline filter. Each entry becomes a
  # [MULTILINE_PARSER] in parsers.conf: `state`/`nextState` name the parser
  # states and `regex` is the Fluent Bit rule pattern for that state. Ships
  # with a .NET parser by default; add more entries or replace this list to
  # cover other log formats.
  multilineParsers:
    - name: dotnet
      rules:
        - state: start_state
          regex: "/^.*Exception[:,].*$/"
          nextState: cont
        - state: cont
          regex: "/^\\s*(at |--- End of|---> ).*$/"
          nextState: cont

openSearchCluster:
  enabled: false

  # SNI hostnames for the TLS passthrough TLSRoute that exposes OpenSearch
  # through the gateway. These must match the gateway tlsPassthrough listener
  # hostname and the SNI that remote fluent-bit clients present
  # (fluent-bit.openSearchVHost). They also need to be present in the OpenSearch
  # server certificate's dnsNames. Required by Gateway API v1 (spec.hostnames is
  # mandatory for TLSRoute).
  tlsRoute:
    hostnames:
      - "opensearch.observability.openchoreo.localhost"

  bootstrap:
    resources:
      limits:
        cpu: 1000m
        memory: 1000Mi
      requests:
        cpu: 100m
        memory: 1000Mi

  general:
    setVMMaxMapCount: true
    version: 3.3.0

  dashboards:
    enable: false
    replicas: 1
    version: 3.3.0

  nodePools:
    data:
      replicas: 2
      diskSize: 5Gi
      resources:
        limits:
          cpu: 1000m
          memory: 1000Mi
        requests:
          cpu: 100m
          memory: 1000Mi

    master:
      replicas: 3
      diskSize: 1Gi
      resources:
        limits:
          cpu: 1000m
          memory: 900Mi
        requests:
          cpu: 100m
          memory: 900Mi

  credentialsSecretName: ""

  internalUsers: |
    # This is the internal user database
    # The hash value is a bcrypt hash and can be generated with plugin/tools/hash.sh

    _meta:
      type: "internalusers"
      config_version: 2

    admin:
      hash: "%s"
      reserved: true
      backend_roles:
      - "admin"
      description: "Admin user"

adapter:
  enabled: true
  observerUrl: "http://observer-internal.openchoreo-observability-plane:8081"
  openSearchSecretName: ""
  image:
    repository: "ghcr.io/openchoreo/observability-logs-opensearch-adapter"
    tag: ""
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 64Mi

openSearchSetup:
  enabled: true
  image:
    repository: "ghcr.io/openchoreo/observability-logs-opensearch-setup"
  openSearchSecretName: ""

  alertingWebhookUrl: "http://observer-internal.openchoreo-observability-plane:8081/api/v1alpha1/alerts/webhook"

  dataRetentionTime:
    containerLogs: "30d"
    k8sEvents: "30d"
    # A compliance record rather than an operational one, so kept far longer than the
    # two above.
    auditLogs: "365d"
