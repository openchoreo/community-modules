{{- if .Values.adapter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracing-adapter-openobserve
  namespace: {{ .Release.Namespace }}
  labels:
    app: tracing-adapter-openobserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracing-adapter-openobserve
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/adapter/configmap.yaml") . | sha256sum }}
      labels:
        app: tracing-adapter-openobserve
    spec:
      securityContext:
        runAsUser: 10500
        runAsGroup: 10500
        runAsNonRoot: true
      containers:
      - name: tracing-adapter-openobserve
        image: "{{ .Values.adapter.image.repository }}:{{ .Values.adapter.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.adapter.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 9100
        envFrom:
        - configMapRef:
            name: tracing-adapter-openobserve
        env:
        - name: OPENOBSERVE_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adapter.openObserveCredentialsSecret.name | quote }}
              key: {{ .Values.adapter.openObserveCredentialsSecret.userKey | quote }}
        - name: OPENOBSERVE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adapter.openObserveCredentialsSecret.name | quote }}
              key: {{ .Values.adapter.openObserveCredentialsSecret.passwordKey | quote }}
        # Raw trace queries run as a user of their own. Without these keys, the adapter answers raw queries with 501.
        - name: OPENOBSERVE_RAW_QUERY_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "observability-tracing-openobserve.rawQuerySecretName" . | quote }}
              key: rawQueryUsername
              optional: true
        - name: OPENOBSERVE_RAW_QUERY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "observability-tracing-openobserve.rawQuerySecretName" . | quote }}
              key: rawQueryPassword
              optional: true
        resources:
          limits:
            cpu: {{ .Values.adapter.resources.limits.cpu }}
            memory: {{ .Values.adapter.resources.limits.memory }}
          requests:
            cpu: {{ .Values.adapter.resources.requests.cpu }}
            memory: {{ .Values.adapter.resources.requests.memory }}
{{- end }}
