{{- if .Values.openSearchSetup.enabled }}
{{- if not .Values.openSearchSetup.openSearchSecretName }}
{{- fail "openSearchSetup.openSearchSecretName is required when openSearchSetup is enabled. Create a Secret with 'username' and 'password' keys." }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-setup-tracing
  namespace: {{.Release.Namespace}}
  annotations:
    helm.sh/hook: post-install, post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: opensearch-setup
        env:
        - name: OPENSEARCH_ADDRESS
          value: "https://opensearch:9200"
        - name: OPENSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.openSearchSetup.openSearchSecretName }}
              key: username
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.openSearchSetup.openSearchSecretName }}
              key: password
        - name: OTEL_TRACES_MIN_INDEX_AGE
          value: "{{ .Values.openSearchSetup.dataRetentionTime.traces }}"
        - name: OTEL_TRACES_EXTRA_MAPPINGS
          value: {{ .Values.openSearchSetup.traceIndexMappings | default dict | toJson | quote }}
        - name: RAW_QUERY_CREDENTIALS_SECRET
          value: {{ include "observability-tracing-opensearch.rawQuerySecretName" . | quote }}
        - name: RAW_QUERY_INDEX_PATTERN
          value: {{ printf "%s*" .Values.adapter.openSearchIndexPrefix | quote }}
        - name: RAW_QUERY_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "observability-tracing-opensearch.rawQuerySecretName" . }}
              key: rawQueryUsername
              optional: true
        - name: RAW_QUERY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "observability-tracing-opensearch.rawQuerySecretName" . }}
              key: rawQueryPassword
              optional: true
        image: {{ include "observability-tracing-opensearch.image" (dict "image" .Values.openSearchSetup.image "context" .) | quote }}
        imagePullPolicy: {{ .Values.openSearchSetup.image.pullPolicy | default "IfNotPresent" }}
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "75Mi"
            cpu: "75m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          readOnlyRootFilesystem: true
          runAsGroup: 10500
          runAsUser: 10500

      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
{{- end }}
