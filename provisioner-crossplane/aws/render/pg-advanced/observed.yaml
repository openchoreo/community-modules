#
# The composed resources as the provider reports them once AWS has finished.
# Pass with --observed-resources to render a later reconcile, where the
# AdvancedPostgresInstance gets its address and becomes Ready. Without it, the
# first reconcile renders only the parameter group and the security group: the
# instance is created once both exist.
#
# The instance reports 100 GiB, as if storage autoscaling had grown it past the
# 64 GiB in xr.yaml, so the render asks for 100: the Composition never asks for
# less storage than RDS reports.
apiVersion: rds.aws.m.upbound.io/v1beta1
kind: Instance
metadata:
  name: r-orders-db-development-1a2b3c4d
  namespace: dp-default-shop-development-5f6e7d8c
  annotations:
    crossplane.io/composition-resource-name: instance
    crossplane.io/external-name: db-ABCDEFGHIJKLMNOPQRSTUVWXYZ
spec:
  forProvider:
    identifier: xp-r-orders-db-development-1a2b3c4d-a8b59b7c
status:
  atProvider:
    address: xp-r-orders-db-development-1a2b3c4d-a8b59b7c.c1a2b3c4d5e6.us-east-1.rds.amazonaws.com
    allocatedStorage: 100
  conditions:
    - type: Ready
      status: "True"
      reason: Available
      lastTransitionTime: "2026-11-26T00:00:00Z"
