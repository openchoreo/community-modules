#
# Builds a PostgresInstance as an Azure Database for PostgreSQL Flexible Server.
#
# For each PostgresInstance, in the PostgresInstance's own namespace:
#   FlexibleServer            the server; its password is generated by the
#                             provider and never leaves the data plane
#   FlexibleServerDatabase    the application database
#   FlexibleServerFirewallRule one per entry in `postgres.firewallRules`
#
# Per-data-plane settings come from the `azure` EnvironmentConfig: the resource
# group, region and name prefix shared by every Azure Composition, and the
# Postgres-only settings under `postgres`. Nothing cloud-specific reaches the
# ResourceType. The resource group is referenced by name and never created or
# deleted here.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgres-azure
  labels:
    app.kubernetes.io/name: provisioner-crossplane
    app.kubernetes.io/part-of: openchoreo
spec:
  compositeTypeRef:
    apiVersion: crossplane.community.openchoreo.dev/v1alpha1
    kind: PostgresInstance
  mode: Pipeline
  pipeline:
    # 1. Load this data plane's settings into the pipeline context.
    - step: load-settings
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: azure

    # 2. Render the Azure resources, and copy what clients need into the
    #    PostgresInstance's status.
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $settings := index .context "apiextensions.crossplane.io/environment" }}
            {{- $pg := $settings.postgres }}

            {{- /* Azure server names are global, 3-63 characters. The
                   PostgresInstance name only covers the Resource and the
                   environment, so add a hash of its namespace, which differs
                   per OpenChoreo namespace and project. If the result is too
                   long, keep it unique with a hash of the full name. A server
                   that already exists keeps its name. */}}
            {{- $azureName := printf "%s%s-%s" $settings.namePrefix $xr.metadata.name ($xr.metadata.namespace | sha256sum | trunc 8) }}
            {{- if gt (len $azureName) 63 }}
            {{- $azureName = printf "%s-%s" ($azureName | trunc 54 | trimSuffix "-") ($azureName | sha256sum | trunc 8) }}
            {{- end }}
            {{- with getComposedResource . "server" }}
            {{- with dig "metadata" "annotations" "crossplane.io/external-name" "" . }}
            {{- $azureName = . }}
            {{- end }}
            {{- end }}

            {{- $sku := index (dict "small" "B_Standard_B1ms" "medium" "GP_Standard_D2ds_v5" "large" "GP_Standard_D4ds_v5") $xr.spec.size }}
            {{- $storageMb := index (dict "small" 32768 "medium" 65536 "large" 131072) $xr.spec.size }}

            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServer
            metadata:
              name: {{ $xr.metadata.name }}
              annotations:
                {{ setResourceNameAnnotation "server" }}
                crossplane.io/external-name: {{ $azureName }}
            spec:
              forProvider:
                resourceGroupName: {{ $settings.resourceGroupName }}
                location: {{ $settings.location }}
                version: {{ $xr.spec.version | quote }}
                skuName: {{ $sku }}
                storageMb: {{ $storageMb }}
                administratorLogin: {{ $pg.administratorLogin }}
                autoGeneratePassword: true
                administratorPasswordSecretRef:
                  name: {{ $xr.metadata.name }}-admin
                  key: password
                publicNetworkAccessEnabled: true
              writeConnectionSecretToRef:
                name: {{ $xr.metadata.name }}-conn
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServerDatabase
            metadata:
              name: {{ $xr.metadata.name }}
              annotations:
                {{ setResourceNameAnnotation "database" }}
                crossplane.io/external-name: {{ $xr.spec.database }}
            spec:
              forProvider:
                serverIdRef:
                  name: {{ $xr.metadata.name }}
                charset: UTF8
                collation: en_US.utf8
            {{- range $pg.firewallRules }}
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServerFirewallRule
            metadata:
              name: {{ $xr.metadata.name }}-{{ .name }}
              annotations:
                {{ setResourceNameAnnotation (printf "firewall-%s" .name) }}
                crossplane.io/external-name: {{ .name }}
            spec:
              forProvider:
                serverIdRef:
                  name: {{ $xr.metadata.name }}
                startIpAddress: {{ .startIpAddress }}
                endIpAddress: {{ .endIpAddress }}
            {{- end }}
            ---
            {{- /* No resource-name annotation: this updates the
                   PostgresInstance's own status instead of composing one. */}}
            apiVersion: crossplane.community.openchoreo.dev/v1alpha1
            kind: PostgresInstance
            status:
              port: 5432
              database: {{ $xr.spec.database }}
              username: {{ $pg.administratorLogin }}
              {{- with getComposedResource . "server" }}
              {{- with dig "status" "atProvider" "fqdn" "" . }}
              address: {{ . }}
              {{- end }}
              {{- end }}

    # 3. Mark each resource Ready when Azure reports it Ready, and the
    #    PostgresInstance Ready when all of them are.
    - step: ready
      functionRef:
        name: function-auto-ready
