kind: ManagedRedis
metadata:
  name: r-orders-cache-development-1a2b3c4d
  namespace: dp-default-shop-development-5f6e7d8c
  annotations:
    crossplane.io/composition-resource-name: cache
spec:
  writeConnectionSecretToRef:
    name: r-orders-cache-development-1a2b3c4d-provider-conn
status:
  atProvider:
    hostname: xp-r-orders-cache-development-1a2b3c4d.eastus.redis.azure.net
    defaultDatabase:
      port: 10000
  conditions:
    - type: Ready
      status: "True"
      reason: Available
      lastTransitionTime: "2026-10-01T00:00:00Z"
