#
# The Crossplane providers for the GCP services this backing uses, each
# authenticating with GKE Workload Identity. Installing any of them also
# installs `provider-family-gcp`, which owns the ProviderConfig types. Apply
# only the providers for the resources this data plane offers.
#
# Replace <project> with the GCP project the resources go in. Each provider
# acts as its own Google service account, xp-<provider name>@<project>, which
# must allow the provider's ServiceAccount to act as it:
#   roles/iam.workloadIdentityUser for
#   serviceAccount:<project>.svc.id.goog[crossplane-system/<provider name>]
# Each ServiceAccount name is fixed below for that reason: left to Crossplane,
# it is named after the provider revision and changes on every upgrade.

# PostgreSQL: Cloud SQL for PostgreSQL
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-gcp-sql
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-gcp-sql
      annotations:
        iam.gke.io/gcp-service-account: xp-provider-gcp-sql@<project>.iam.gserviceaccount.com
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-sql
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-sql:v3.1.0
  runtimeConfigRef:
    name: provider-gcp-sql
---
# Redis: Memorystore for Redis
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-gcp-redis
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-gcp-redis
      annotations:
        iam.gke.io/gcp-service-account: xp-provider-gcp-redis@<project>.iam.gserviceaccount.com
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-redis
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-redis:v3.1.0
  runtimeConfigRef:
    name: provider-gcp-redis
